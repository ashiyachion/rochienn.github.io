<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>找不到頁面 · ashiya</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // 和首頁用同一個主題設定
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved === 'dark' || saved === 'light'
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    /* 這一頁不依賴其他檔案，網址再深都能正常顯示 */
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --text: #1c1e2b;
      --muted: #4f5468;
      --accent: #a04c0d;
      --border: rgba(28, 30, 43, 0.2);
      --orb: #ffb06e;
      --orb-glow: rgba(255, 150, 80, 0.45);
      --glow: rgba(255, 170, 105, 0.3);
      --star: transparent;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0d1a;
      --text: #ebe9f4;
      --muted: #a9aec6;
      --accent: #ffc978;
      --border: rgba(200, 210, 255, 0.2);
      --orb: #ffe6b2;
      --orb-glow: rgba(255, 214, 150, 0.35);
      --glow: rgba(255, 201, 120, 0.07);
      --star: rgba(227, 231, 255, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 1.75;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(70vmax 55vmax at 88% -12%, var(--glow), transparent 62%),
        radial-gradient(1.5px 1.5px at 8% 14%, var(--star), transparent),
        radial-gradient(1px 1px at 18% 62%, var(--star), transparent),
        radial-gradient(1.2px 1.2px at 27% 28%, var(--star), transparent),
        radial-gradient(1px 1px at 33% 84%, var(--star), transparent),
        radial-gradient(1.6px 1.6px at 41% 9%, var(--star), transparent),
        radial-gradient(1px 1px at 49% 47%, var(--star), transparent),
        radial-gradient(1.3px 1.3px at 56% 73%, var(--star), transparent),
        radial-gradient(1px 1px at 63% 19%, var(--star), transparent),
        radial-gradient(1.5px 1.5px at 71% 58%, var(--star), transparent),
        radial-gradient(1px 1px at 78% 31%, var(--star), transparent),
        radial-gradient(1.2px 1.2px at 86% 81%, var(--star), transparent),
        radial-gradient(1px 1px at 92% 12%, var(--star), transparent),
        radial-gradient(1.4px 1.4px at 95% 46%, var(--star), transparent),
        radial-gradient(1px 1px at 4% 41%, var(--star), transparent),
        radial-gradient(1.2px 1.2px at 13% 90%, var(--star), transparent),
        radial-gradient(1px 1px at 59% 93%, var(--star), transparent),
        radial-gradient(1.3px 1.3px at 74% 6%, var(--star), transparent),
        radial-gradient(1px 1px at 37% 39%, var(--star), transparent);
    }

    .orb {
      --size: 96px;
      width: var(--size);
      height: var(--size);
      margin: 0 auto 32px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 calc(var(--size) / 2) var(--orb);
      filter: drop-shadow(0 0 30px var(--orb-glow));
    }

    :root[data-theme="dark"] .orb {
      box-shadow: inset -25px 12px 0 0 var(--orb);
    }

    .code {
      margin: 0;
      color: var(--accent);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.35em;
    }

    h1 {
      margin: 0.4rem 0 0;
      font-size: clamp(1.7rem, 1.2rem + 2.4vw, 2.6rem);
      line-height: 1.35;
      letter-spacing: 0.02em;
    }

    .text {
      margin: 0.8rem 0 0;
      color: var(--muted);
    }

    .home {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      margin-top: 1.8rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }

    .home:hover {
      border-color: var(--accent);
    }

    .home:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <p class="code">404</p>
    <h1>這一頁不在地圖上。</h1>
    <p class="text">可能搬家了，或是從來沒有存在過。</p>
    <a class="home" href="/">← 回到首頁</a>
  </main>
</body>
</html>
